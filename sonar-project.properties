# SonarQube (self-hosted Server) configuration for FeedClaw.
# SONAR_TOKEN and SONAR_HOST_URL are provided by CI secrets.
sonar.projectKey=marceloalmeidadev_feedclaw_a96ac60c-7361-4242-b175-453d46399bd9

# Analyze the whole repo; test files are declared separately so they are not
# double-counted as production code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Keep production sources free of tests, fixtures, the (future) built UI and
# vendored/generated artifacts.
sonar.exclusions=**/*_test.go,**/testdata/**,ui/**,bin/**,dist/**

# Go test coverage, produced in CI as coverage.out (standard Go cover format).
sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
