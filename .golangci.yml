# golangci-lint v2 configuration for FeedClaw.
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused are enabled by default.
  enable:
    - bodyclose
    - misspell
  exclusions:
    rules:
      # Test files may ignore errors on best-effort setup helpers.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
